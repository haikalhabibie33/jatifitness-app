version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: gym_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: gym_app
      MARIADB_USER: gym_app
      MARIADB_PASSWORD: gym123
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
